[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchest"
version = "0.1.0"
description = "Decentralized MLOps Orchestrator for Heterogeneous Edge Devices (Swarm Inference)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "HCMUT DATN Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "psutil>=5.9.0",
    "pyzmq>=25.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
]

[project.scripts]
orchest = "apps.cli:main"
